name: Validate Lockstep Release Tags

on:
  push:
    tags:
      - "v*"
      - "api/v*"

permissions:
  contents: read

jobs:
  validate-release:
    name: Operator and API release are in sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Resolve lockstep versions
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "${RELEASE_TAG}" =~ ^v([0-9]{2})\.([0-9]{1,2})\.([0-9]+)$ ]]; then
            operator_major="${BASH_REMATCH[1]}"
            operator_minor="${BASH_REMATCH[2]}"
            operator_patch="${BASH_REMATCH[3]}"
            printf -v padded_minor "%02d" "${operator_minor}"
            operator_tag="${RELEASE_TAG}"
            api_version="v0.${operator_major}${padded_minor}.${operator_patch}"
            api_tag="api/${api_version}"
          elif [[ "${RELEASE_TAG}" =~ ^api/v0\.([0-9]{4})\.([0-9]+)$ ]]; then
            encoded_minor="${BASH_REMATCH[1]}"
            operator_major="${encoded_minor:0:2}"
            operator_minor="$((10#${encoded_minor:2:2}))"
            operator_patch="${BASH_REMATCH[2]}"
            operator_tag="v${operator_major}.${operator_minor}.${operator_patch}"
            api_tag="${RELEASE_TAG}"
            api_version="${api_tag#api/}"
          else
            echo "::error::Unsupported release tag ${RELEASE_TAG}"
            exit 1
          fi

          {
            echo "operator_tag=${operator_tag}"
            echo "api_tag=${api_tag}"
            echo "api_version=${api_version}"
          } >>"${GITHUB_OUTPUT}"

      - name: Verify companion tag and module requirement
        shell: bash
        env:
          OPERATOR_TAG: ${{ steps.release.outputs.operator_tag }}
          API_TAG: ${{ steps.release.outputs.api_tag }}
          API_VERSION: ${{ steps.release.outputs.api_version }}
        run: |
          set -euo pipefail

          tagged_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          operator_commit="$(git rev-list -n 1 "${OPERATOR_TAG}")"
          api_commit="$(git rev-list -n 1 "${API_TAG}")"

          if [[ "${operator_commit}" != "${tagged_commit}" ||
                "${api_commit}" != "${tagged_commit}" ]]; then
            echo "::error::${OPERATOR_TAG} and ${API_TAG} must point to ${tagged_commit}"
            exit 1
          fi

          api_module="github.com/NVIDIA/gpu-operator/api"
          required_version="$(
            awk -v module="${api_module}" '$1 == module { print $2; exit }' go.mod
          )"
          if [[ "${required_version}" != "${API_VERSION}" ]]; then
            echo "::error::Root go.mod requires ${required_version}; expected ${API_VERSION}"
            exit 1
          fi

          listed_version="$(go list -m -mod=mod -f '{{.Version}}' "${api_module}")"
          if [[ "${listed_version}" != "${API_VERSION}" ]]; then
            echo "::error::go list reported ${listed_version}; expected ${API_VERSION}"
            exit 1
          fi

      - name: Build operator
        run: go build -mod=vendor -o "${RUNNER_TEMP}/gpu-operator" ./cmd/gpu-operator

      - name: Test module release
        env:
          GPU_OPERATOR_TAG: ${{ steps.release.outputs.operator_tag }}
          GPU_OPERATOR_API_TAG: ${{ steps.release.outputs.api_tag }}
          GPU_OPERATOR_API_VERSION: ${{ steps.release.outputs.api_version }}
        run: go test -v .
