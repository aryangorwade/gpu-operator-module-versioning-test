name: Validate Release API Version

on:
  pull_request:
    paths:
      - "go.mod"
      - "api/go.mod"
      - "versions.mk"
      - "vendor/modules.txt"
      - ".github/scripts/versioning.py"
      - ".github/scripts/versioning_test.py"
      - ".github/workflows/api-tag-check.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-versioning:
    name: Operator and API versions are mapped
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate version mapping
        run: make validate-versioning

      - name: Verify a changed API version is unreleased
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          api_version="$(python3 .github/scripts/versioning.py required-api)"
          git show "${BASE_SHA}:go.mod" >"${RUNNER_TEMP}/base.go.mod"
          base_version="$(
            python3 .github/scripts/versioning.py required-api \
              --go-mod "${RUNNER_TEMP}/base.go.mod"
          )"

          if [[ "${api_version}" == "${base_version}" ]]; then
            echo "API requirement remains at ${api_version}; no unpublished-tag check is needed."
            exit 0
          fi

          api_tag="api/${api_version}"
          repository_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

          echo "API requirement changes from ${base_version} to ${api_version}."
          echo "Confirming ${api_tag} has not already been published."

          if git ls-remote --exit-code --tags \
            "${repository_url}" "refs/tags/${api_tag}" >/dev/null; then
            echo "::error::API tag ${api_tag} already exists in ${repository_url}"
            exit 1
          fi

          echo "Verified ${api_tag} is available for this release."
